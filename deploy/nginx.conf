# Sentiers, servi par nginx.
#
# Ce que ce fichier ajoute par rapport à GitHub Pages n'est pas la vitesse :
# c'est la possibilité de **poser des en-têtes**. Pages n'en permet aucun, si
# bien que la promesse écrite en haut de chaque écran — « vos traces GPX ne
# quittent jamais votre navigateur » — n'était qu'une affirmation. Ici, une
# politique de sécurité de contenu la fait appliquer par le navigateur
# lui-même : une requête vers un hôte non listé est refusée avant de partir.
#
# La liste des hôtes ci-dessous est donc la déclaration exhaustive de ce que
# l'application a le droit de contacter. Elle doit rester d'accord avec
# `SortiesReseau`, qui compte ces sorties à l'écran, et avec la page
# « pourquoi ». Un test de bout en bout la compare.

server {
    # Port non privilégié : le conteneur tourne sans root.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version du serveur : cela n'aide que qui cherche
    # une faille connue.
    server_tokens off;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------
    # En-têtes communs
    # ------------------------------------------------------------------
    # `always` : sans lui, nginx omet l'en-tête sur les réponses d'erreur —
    # c'est-à-dire exactement là où une page injectée ferait le plus de mal.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Aucune de ces API n'est employée, et le dire ferme la porte à un script
    # tiers qui s'y glisserait. La géolocalisation, elle, est le cœur de
    # l'enregistrement d'une sortie : elle reste ouverte à l'origine seule.
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;

    # ------------------------------------------------------------------
    # La politique de sécurité de contenu
    # ------------------------------------------------------------------
    # Elle vit dans `deploy/csp.conf`, incluse ici **et** lue par
    # `vite.config.ts` : le serveur de prévisualisation sert les mêmes
    # en-têtes, si bien que les tests de bout en bout tournent contre la
    # politique réelle. Une politique éprouvée seulement en production est
    # une politique éprouvée par les gens.
    # Hors de `conf.d/` **volontairement** : l'image officielle inclut
    # `conf.d/*.conf` au niveau `http`, où la directive `set` est interdite.
    # Posé là, ce fichier aurait été chargé deux fois et nginx aurait refusé
    # de démarrer — un déploiement qui échoue au lancement, pour un fichier
    # rangé au mauvais endroit.
    include /etc/nginx/csp.conf;
    add_header Content-Security-Policy $csp always;

    # ------------------------------------------------------------------
    # Cache
    # ------------------------------------------------------------------
    # Les fichiers d'`assets/` portent une empreinte dans leur nom : leur
    # contenu ne change jamais, seul leur nom change. Un an, immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
    }

    # Le service worker ne se cache pas.
    #
    # C'est **le** piège du déploiement d'une application hors ligne : un
    # `sw.js` mis en cache une journée fige l'application entière pour cette
    # journée, y compris un correctif urgent — le navigateur ne va pas
    # rechercher le nouveau service worker tant qu'il croit avoir l'ancien.
    # `index.html` suit la même règle, pour la même raison.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
    }

    # ------------------------------------------------------------------
    # Routage
    # ------------------------------------------------------------------
    # `try_files` sert le fichier s'il existe, et retombe sur l'application
    # sinon. L'ordre compte : `pourquoi.html` est une vraie seconde page, et
    # une redirection posée avant celle-ci l'aurait avalée.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Un point de contrôle pour l'orchestrateur, qui ne dépend d'aucun
    # fichier de l'application : il répond même si le build a échoué, ce qui
    # est exactement le moment où l'on veut une réponse.
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
