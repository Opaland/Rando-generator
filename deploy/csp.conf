# La politique de sécurité de contenu de Sentiers — **une seule fois**.
#
# Ce fichier est lu par deux mondes qui ne se parlent pas : nginx l'inclut en
# production, et `vite.config.ts` le lit pour que le serveur de
# prévisualisation serve exactement les mêmes en-têtes. Les 285 tests de bout
# en bout tournent donc contre la politique réelle, et non contre une version
# permissive qui laisserait passer ce que la production refuse.
#
# Sans cela, la politique n'aurait été éprouvée qu'en production — c'est-à-
# dire par les gens.
#
# ## Ce que chaque hôte fait ici
#
#   data.geopf.fr             fond de carte IGN (WMTS) et profil altimétrique
#   tile.openstreetmap.org    fond de repli quand l'IGN ne répond pas
#   overpass-api.de           itinéraires et points d'intérêt
#   overpass.kumi.systems     second miroir Overpass
#   api-adresse.data.gouv.fr  recherche d'un lieu par son nom
#
# Cette liste **est** la promesse écrite en haut de chaque écran, rendue
# vérifiable : une requête vers un autre hôte est refusée par le navigateur
# avant de partir. `tests/unit/csp.test.ts` la compare à ce que le code
# contacte réellement, dans les deux sens — un hôte oublié casserait
# l'application, un hôte en trop ouvrirait une porte que personne n'a
# demandée.
#
# ## Les concessions, et pourquoi
#
#   worker-src blob:     MapLibre crée ses ouvriers depuis un blob, et le
#                        calcul de correspondance tourne dans un `Worker`.
#                        Sans cette ligne, la carte ne s'affiche pas.
#
# **Les hôtes de tuiles sont dans `connect-src`, pas seulement dans
# `img-src`.** MapLibre charge ses tuiles par `fetch` et non par une balise
# `<img>` : c'est `connect-src` qui décide. Posés dans `img-src` seul, les
# fonds de carte étaient refusés — deux mille violations dans la console de
# la séance « monkey », et une carte grise.
#
# `tile.openstreetmap.org` figure donc dans les deux. Ce n'est pas une
# redondance inutile : MapLibre peut retomber sur un chargement par image
# selon la source, et l'hôte est le même — la surface exposée n'augmente pas.
#   img-src blob:        la carte de partage est peinte dans un canevas puis
#                        relue en image.
#   style-src unsafe-inline  MapLibre injecte ses styles, et les pastilles de
#                        couleur sont posées en attribut `style`.
#
# Il n'y a **ni** `'unsafe-inline'` **ni** `'unsafe-eval'` sur les scripts.
# C'est ce qui fait la différence entre une politique qui protège et une
# politique qui décore.
set $csp "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https://data.geopf.fr https://tile.openstreetmap.org; connect-src 'self' https://data.geopf.fr https://tile.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems https://api-adresse.data.gouv.fr; manifest-src 'self'";
