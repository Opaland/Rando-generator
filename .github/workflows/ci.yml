name: CI

on:
  push:
  pull_request:

# Une nouvelle poussée sur la même branche annule la précédente.
#
# Sans cela, un run lent ou bloqué garde son exécutant et les suivants font
# la queue derrière lui. Le 23/08, l'étape e2e d'une PR **de documentation
# seule** a mis cinquante minutes, sur exactement le code qui venait de
# passer en quatre minutes et demie — elle a fini par réussir, mais elle a
# tenu la file pendant tout ce temps.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Listes jumelles (le CSS et la sonde disent la même règle)
        run: npm run listes
      - name: Textes (le README annonce tous les filtres qui existent)
        run: npm run textes
      - name: Chemins cités (un commentaire qui nomme un fichier affirme qu'il existe)
        run: npm run chemins
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires (un seuil de couverture par domaine)
        run: npm run coverage
      - name: Ports du magasin (aucune lambda de câblage jamais appelée)
        # Après `coverage`, et pas avant : c'est le rapport qu'il vient
        # d'écrire que ce contrôle lit. Il refuse d'ailleurs un rapport plus
        # vieux que les sources.
        run: npm run ports
      - name: Build
        run: npm run build
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium pour Playwright
        # Issue #587 : le navigateur sort du cache, mais `--with-deps` passe
        # par `apt`, et le miroir `azure.archive.ubuntu.com` est parfois lent.
        # Mesuré, même image (ubuntu-26.04) et mêmes paquets : 21,9 Mo en
        # 4 s le 29/10, contre 1,5 Mo en 3 min 19 s le 26/10. Cette fois-là,
        # l'étape a dépassé ses 10 minutes sans qu'un test tourne. La piste
        # « image Ubuntu 26 » de l'issue est écartée : les vertes y sont aussi.
        #
        # D'où une borne par essai, et trois essais : un essai qui cale est
        # coupé, et le suivant rouvre ses connexions. Que le second tombe sur
        # un miroir plus rapide est un pari, non une mesure.
        #
        # 180 s est tranché au jugé (§2, un délai de CI, pas un calcul) :
        # l'étape entière prend 28 s quand le miroir répond, soit plus de
        # six fois de marge. `timeout` tue le groupe de processus, apt
        # compris (vérifié dans le conteneur), et `dpkg --configure -a`
        # reprend une installation coupée en cours de route.
        run: |
          for essai in 1 2 3; do
            if timeout 180 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Installation de Chromium : essai ${essai} sur 3 échoué ou coupé à 180 s (#587)"
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 12
      - name: Tests e2e
        run: npm run e2e
        # Une borne, et une seule chose à ne pas rater : elle doit être
        # au-dessus du pire cas **observé**, pas du cas ordinaire.
        #
        # Mesuré sur ce dépôt : 3,7 à 4,5 minutes d'habitude — mais un run
        # du 23/08 a mis cinquante minutes sur un exécutant lent, et il a
        # réussi. Une borne à vingt minutes, posée avant de connaître ce
        # chiffre, aurait transformé une réussite en échec : c'est le
        # contraire de ce qu'on veut d'une porte.
        #
        # Soixante-quinze minutes ne protègent donc pas de la lenteur, et
        # c'est délibéré. Elles protègent de l'infini — la limite de six
        # heures de GitHub — et rendent l'exécutant en une heure et quart au
        # lieu d'une demi-journée.
        timeout-minutes: 75
        env:
          CI: 'true'
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
