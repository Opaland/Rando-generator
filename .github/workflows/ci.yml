name: CI

on:
  push:
  pull_request:

# Une nouvelle poussée sur la même branche annule la précédente.
#
# Sans cela, un run bloqué garde un exécutant jusqu'à la limite de six
# heures de GitHub, et les suivants font la queue derrière lui. C'est arrivé
# le 23/08 : l'étape e2e d'une PR **de documentation seule** est restée en
# cours cinquante minutes, sur exactement le code qui venait de passer en
# quatre minutes et demie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires (couverture ≥ 90 % sur src/core)
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Tests e2e
        run: npm run e2e
        # Mesuré sur ce dépôt : la suite e2e prend de 3,7 à 4,5 minutes en
        # intégration continue. Vingt minutes laissent donc quatre fois le
        # pire cas observé, et bornent ce qui n'était pas borné — la
        # configuration Playwright n'a pas de `globalTimeout`, et le délai
        # par test ne protège pas d'un serveur de prévisualisation qui ne
        # rend jamais la main.
        timeout-minutes: 20
        env:
          CI: 'true'
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
